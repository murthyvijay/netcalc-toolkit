[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "netcalc-toolkit"
version = "1.1.0"
description = "Stdlib-only Python calculators for Layer 1, optics, wireless, performance, queueing, routing, QoS, protocols and AI fabrics"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Vijay Anantha Murthy" }]
requires-python = ">=3.9"
keywords = ["networking", "ccna", "ccnp", "fec", "ber", "roce", "ultra-ethernet", "calculator",
            "dwdm", "bgp", "qos", "queueing", "wifi"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Networking",
    "Intended Audience :: Telecommunications Industry",
]

[project.scripts]
netcalc = "netcalc.__main__:main"

[tool.setuptools.packages.find]
include = ["netcalc*"]
